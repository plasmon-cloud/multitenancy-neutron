name: Kernel CI

on:
  push:
    branches:
      - main
      # `dev` is the integration base for multitenancy-neutron release branches.
      - dev
      - version-0.1.0
      - version-0.2.0
  pull_request:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show toolchain
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            node --version
            npm --version
            bun --version
            mops --version
          '

      - name: Install dependencies
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm ci
          '

      # Package first because the kernel test suite validates generated
      # artifacts produced by the normal packaging pipeline. Do not run a
      # separate build here: package already performs the build.
      - name: Kernel package
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm --workspace neutron-kernel run package
          '

      # npm test is the documented fast core gate. It runs every
      # test-bearing package workspace plus the Kernel Bun and Motoko suites.
      # Application, support, release, and E2E suites remain separate groups.
      - name: Core tests
        run: |
          nix develop --command bash -lc '
            set -euxo pipefail
            npm test
          '
