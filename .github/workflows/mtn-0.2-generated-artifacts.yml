name: multitenancy-neutron 0.2 Generated Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - version-0.2.0
    paths:
      - .github/workflows/mtn-0.2-generated-artifacts.yml

permissions:
  contents: write
  statuses: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout version-0.2.0
        uses: actions/checkout@v4
        with:
          ref: version-0.2.0
          fetch-depth: 0

      - name: Publish refresh start
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg state pending --arg context mtn-0.2/generated-artifacts --arg description "canonical generated-artifact refresh started" \
            '{state:$state,context:$context,description:$description}' >/tmp/status.json
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: |
          nix develop --command bash -lc 'set -euxo pipefail; npm ci'

      - name: Generate and commit canonical artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          post_status() {
            local context="$1"
            local state="$2"
            local description="$3"
            description="$(printf '%s' "$description" | tr '\n\r' '  ' | cut -c1-130)"
            jq -n --arg state "$state" --arg context "mtn-0.2/generated-$context" --arg description "$description" \
              '{state:$state,context:$context,description:$description}' >/tmp/status.json
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/status.json >/dev/null
          }

          gate() {
            local context="$1"
            shift
            local log="/tmp/generated-${context}.log"
            set +e
            "$@" 2>&1 | tee "$log"
            local code=${PIPESTATUS[0]}
            set -e
            if [ "$code" -eq 0 ]; then
              post_status "$context" success "passed"
              return 0
            fi
            local diagnostic
            diagnostic="$(grep -Eai 'error|fail|unexpected|mismatch|missing|changed|dirty' "$log" | tail -n 1 || true)"
            if [ -z "$diagnostic" ]; then diagnostic="$(tail -n 1 "$log" || true)"; fi
            post_status "$context" failure "${diagnostic:-failed with exit $code}"
            return "$code"
          }

          gate package \
            nix develop --command bash -lc \
            'set -euxo pipefail; npm --workspace neutron-kernel run package'

          gate binding-write \
            nix develop --command bash -lc \
            'set -euxo pipefail; npm --workspace neutron-kernel run certified-assets:candidate-binding:write'

          gate binding-check \
            nix develop --command bash -lc \
            'set -euxo pipefail; npm --workspace neutron-kernel run certified-assets:candidate-binding'

          set +e
          git diff --check >/tmp/generated-scope.log 2>&1
          diff_code=$?
          status_text="$(git status --short)"
          unexpected="$(printf '%s\n' "$status_text" | awk '\
            NF > 0 && \
            $2 != "apps/kernel/backend/main.mo" && \
            $2 != "apps/kernel/neutron.lock.json" && \
            $2 != "apps/kernel/certified-assets-candidate-binding.json" { print }')"
          if [ -n "$unexpected" ]; then
            printf 'Unexpected generated changes:\n%s\n' "$unexpected" >>/tmp/generated-scope.log
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              path="$(printf '%s\n' "$line" | awk '{print $2}')"
              safe_path="$(printf '%s' "$path" | sed 's#[/._]#-#g' | cut -c1-95)"
              post_status "unexpected-${safe_path}" failure "canonical generator changed ${path}"
            done <<< "$unexpected"
            diff_code=1
          fi
          set -e
          if [ "$diff_code" -ne 0 ]; then
            post_status change-scope failure "unexpected canonical generated change scope"
            cat /tmp/generated-scope.log
            exit "$diff_code"
          fi
          post_status change-scope success "only canonical Kernel generated artifacts changed"

          git config user.name "plasmon-cloud automation"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/kernel/backend/main.mo \
            apps/kernel/neutron.lock.json \
            apps/kernel/certified-assets-candidate-binding.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh MTN 0.2 generated Kernel artifacts [skip ci]"
            git push origin HEAD:version-0.2.0
          fi
          post_status commit success "canonical generated artifacts committed"

      - name: Publish refresh success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg state success --arg context mtn-0.2/generated-artifacts --arg description "canonical generated artifacts refreshed" \
            '{state:$state,context:$context,description:$description}' >/tmp/status.json
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null

      - name: Publish refresh failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -n --arg state failure --arg context mtn-0.2/generated-artifacts --arg description "canonical generated-artifact refresh failed; branch source was not patched" \
            '{state:$state,context:$context,description:$description}' >/tmp/status.json
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data-binary @/tmp/status.json >/dev/null
