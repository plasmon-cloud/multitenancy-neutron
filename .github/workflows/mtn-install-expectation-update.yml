name: One-shot MTN Additive Memory Expectation Update

on:
  push:
    branches: [version-0.2.0]
    paths: [.github/workflows/mtn-install-expectation-update.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-0.2.0
          fetch-depth: 0

      - name: Apply exact reviewed expectation changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/kernel/test/install.test.ts';
          let text = fs.readFileSync(path, 'utf8');

          const oldInitSegment = 'NeutronMemory_a6_kernel_r11_app_catalog,"development",NeutronActiveAppInstanceInventory';
          const newInitSegment = 'NeutronMemory_a6_kernel_r11_app_catalog,NeutronMemory_a6_kernel_r24_authorization_grants,NeutronMemory_a6_kernel_r29_authorization_resource_epochs,NeutronMemory_a6_kernel_r20_authorization_audit,"development",NeutronActiveAppInstanceInventory';
          if (text.split(oldInitSegment).length !== 2) {
            throw new Error('expected exactly one old Kernel.Init memory segment');
          }
          text = text.replace(oldInitSegment, newInitSegment);

          const oldRoots = `  expect(Object.keys(manifest.memory).sort()).toEqual([\n    "app_catalog",\n    "app_instance_lifecycle",\n    "app_instances",\n    "kernel",\n    "kernel_activation",\n    "tenants",\n  ]);`;
          const newRoots = `  expect(Object.keys(manifest.memory).sort()).toEqual([\n    "app_catalog",\n    "app_instance_lifecycle",\n    "app_instances",\n    "authorization_audit",\n    "authorization_grants",\n    "authorization_resource_epochs",\n    "kernel",\n    "kernel_activation",\n    "tenants",\n  ]);`;
          if (text.split(oldRoots).length !== 2) {
            throw new Error('expected exactly one old memory-root expectation');
          }
          text = text.replace(oldRoots, newRoots);

          fs.writeFileSync(path, text);
          NODE

          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | awk 'NF {print $2}')" = "apps/kernel/test/install.test.ts"

      - name: Commit exact expectation update
        run: |
          git config user.name "plasmon-cloud automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/kernel/test/install.test.ts
          git commit -m "Update Kernel tests for additive MTN authorization roots [skip ci]"
          git push origin HEAD:version-0.2.0
