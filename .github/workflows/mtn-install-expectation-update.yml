name: One-shot MTN Additive Memory Expectation Update

on:
  push:
    branches: [version-0.2.0]
    paths: [.github/workflows/mtn-install-expectation-update.yml]

permissions:
  contents: write
  statuses: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-0.2.0
          fetch-depth: 0

      - name: Apply exact reviewed expectation changes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'apps/kernel/test/install.test.ts';
          let text = fs.readFileSync(path, 'utf8');

          const oldInit = String.raw`    /NeutronModule_a6_kernel\.Init\([\s\S]*?NeutronMemory_a6_kernel_r6_kernel,[\s\S]*?NeutronMemory_a6_kernel_r17_kernel_activation,[\s\S]*?NeutronMemory_a6_kernel_r7_tenants,[\s\S]*?NeutronMemory_a6_kernel_r13_app_instances,[\s\S]*?NeutronMemory_a6_kernel_r22_app_instance_lifecycle,[\s\S]*?NeutronMemory_a6_kernel_r11_app_catalog,[\s\S]*?"development",[\s\S]*?NeutronActiveAppInstanceInventory,[\s\S]*?Principal\.fromActor\(NeutronCanisterSelf\),[\s\S]*?\)/,`;
          const newInit = String.raw`    /NeutronModule_a6_kernel\.Init\([\s\S]*?NeutronMemory_a6_kernel_r6_kernel,[\s\S]*?NeutronMemory_a6_kernel_r17_kernel_activation,[\s\S]*?NeutronMemory_a6_kernel_r7_tenants,[\s\S]*?NeutronMemory_a6_kernel_r13_app_instances,[\s\S]*?NeutronMemory_a6_kernel_r22_app_instance_lifecycle,[\s\S]*?NeutronMemory_a6_kernel_r11_app_catalog,[\s\S]*?NeutronMemory_a6_kernel_r24_authorization_grants,[\s\S]*?NeutronMemory_a6_kernel_r29_authorization_resource_epochs,[\s\S]*?NeutronMemory_a6_kernel_r20_authorization_audit,[\s\S]*?"development",[\s\S]*?NeutronActiveAppInstanceInventory,[\s\S]*?Principal\.fromActor\(NeutronCanisterSelf\),[\s\S]*?\)/,`;
          if (!text.includes(oldInit)) throw new Error('old Kernel.Init expectation not found exactly');
          text = text.replace(oldInit, newInit);

          const oldRoots = `  expect(Object.keys(manifest.memory).sort()).toEqual([\n    "app_catalog",\n    "app_instance_lifecycle",\n    "app_instances",\n    "kernel",\n    "kernel_activation",\n    "tenants",\n  ]);`;
          const newRoots = `  expect(Object.keys(manifest.memory).sort()).toEqual([\n    "app_catalog",\n    "app_instance_lifecycle",\n    "app_instances",\n    "authorization_audit",\n    "authorization_grants",\n    "authorization_resource_epochs",\n    "kernel",\n    "kernel_activation",\n    "tenants",\n  ]);`;
          if (!text.includes(oldRoots)) throw new Error('old memory-root expectation not found exactly');
          text = text.replace(oldRoots, newRoots);

          fs.writeFileSync(path, text);
          NODE

          git diff --check
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | awk 'NF {print $2}')" = "apps/kernel/test/install.test.ts"

      - name: Commit exact expectation update
        run: |
          git config user.name "plasmon-cloud automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/kernel/test/install.test.ts
          git commit -m "Update Kernel tests for additive MTN authorization roots [skip ci]"
          git push origin HEAD:version-0.2.0
