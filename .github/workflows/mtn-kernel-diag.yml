name: Temporary MTN Kernel Failure Locator

on:
  push:
    branches: [version-0.2.0]
    paths: [.github/workflows/mtn-kernel-diag.yml]

permissions:
  contents: read
  statuses: write

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: version-0.2.0
      - uses: cachix/install-nix-action@v31
      - run: nix develop --command bash -lc 'set -euxo pipefail; npm ci'
      - name: Run Kernel and publish exact failing groups
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          nix develop --command bash -lc 'npm --workspace neutron-kernel test' 2>&1 | tee /tmp/kernel.log
          code=${PIPESTATUS[0]}
          set -e

          post() {
            local context="$1"
            jq -n --arg state failure --arg context "mtn-0.2/$context" --arg description "$context" \
              '{state:$state,context:$context,description:$description}' >/tmp/status.json
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              --data-binary @/tmp/status.json >/dev/null
          }

          index=0
          while IFS= read -r detail; do
            index=$((index + 1))
            safe="$(printf '%s' "$detail" | sed 's#[^A-Za-z0-9-]#-#g' | tr -s '-' | cut -c1-100)"
            post "kernel-paired-${index}-${safe}"
          done < <(awk '
            /^::group::/ { group=$0 }
            /^\(fail\)/ { print group " -- " $0 }
          ' /tmp/kernel.log)

          index=0
          while IFS= read -r detail; do
            index=$((index + 1))
            safe="$(printf '%s' "$detail" | sed 's#[^A-Za-z0-9-]#-#g' | tr -s '-' | cut -c1-100)"
            post "kernel-assert-${index}-${safe}"
          done < <(grep -E 'Expected|Received|error:' /tmp/kernel.log | tail -n 12 || true)

          exit "$code"
